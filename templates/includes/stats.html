<dl class="stats">
<div>
<dt>Матчей</dt>
<dd>{{ statistics.played }}</dd>
</div>
<div>
<dt>Победы</dt>
<dd>{{ statistics.wins }}</dd>
</div>
<div>
<dt>Поражения</dt>
<dd>{{ statistics.losses }}</dd>
</div>
<div>
<dt>Процент побед</dt>
<dd>{{ statistics.win_rate }}%</dd>
</div>
<div>
<dt>Турниров</dt>
<dd>{{ statistics.tournaments }}</dd>
</div>
</dl>
